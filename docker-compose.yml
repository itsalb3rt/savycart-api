services:
  sheiley-shop-db:
    image: mysql:8.0
    volumes:
      - ./etc/db:/docker-entrypoint-initdb.d
      - mysqldata:/var/lib/mysql
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - ${MYSQL_EXPOSED_PORT}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik-network

  sheiley-shop-api:
    build: .
    depends_on:
      sheiley-shop-db:
        condition: service_healthy
    ports:
      - ${API_EXPOSED_PORT}:80
    labels:
      - "traefik.http.routers.sheiley-shop-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.sheiley-shop-api.entrypoints=websecure"
      - "traefik.http.routers.sheiley-shop-api.tls.certresolver=myresolver"
    networks:
      - traefik-network

networks:
  traefik-network:
    external:
      name: traefik_proxynet

volumes:
  mysqldata: